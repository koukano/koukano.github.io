<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Notes</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>Math Notes</h1>
      <p>大学・大学院で学んだ数学をまとめています。</p>
    </div>
  </header>


  <main class="container">

    <section class="intro">
      <h2>このサイトについて</h2>

      <p>
        複素解析、特殊関数、微分方程式などについて、
        学んだ内容を整理しています。
      </p>

      <p>
        定義だけでなく、具体例や証明、直感的な説明も
        できるだけ掲載していく予定です。
      </p>
    </section>


    <section class="categories">

      <h2>Topics</h2>

      <div class="card-container">

        <div class="card">
          <h3>複素解析</h3>
          <p>
            正則関数、留数定理、解析接続、
            リーマンの写像定理など。
          </p>
        </div>


        <div class="card">
          <h3>特殊関数</h3>
          <p>
            ガンマ関数、ベータ関数、
            超幾何関数など。
          </p>
        </div>


        <div class="card">
          <h3>微分方程式</h3>
          <p>
            線形常微分方程式、
            Frobenius法、特異点など。
          </p>
        </div>

      </div>

    </section>


    <section class="articles">

      <h2>Articles</h2>

      <p class="coming-soon">
        記事はこれから追加していきます。
      </p>

    </section>

  </main>


  <footer>

    <p>© Math Notes</p>

  </footer>


</body>

</html>
