<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">ルジャンドル多項式の幾何学的設定</title>
<desc id="desc">原点O、単位ベクトルの端点e、点P、距離rとrho、角thetaの関係を黒線と破線で示した図。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
</marker>

</defs>
<style>
  text { font-family: "Times New Roman", "Noto Serif JP", serif; fill: #111111; }
  .axis { stroke: #111111; stroke-width: 2; fill: none; }
  .tick { stroke: #111111; stroke-width: 1.4; }
  .guide { stroke: #777777; stroke-width: 1.3; stroke-dasharray: 7 6; fill: none; }
  .curve { stroke: #111111; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .curve-thin { stroke: #111111; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 19px; }
  .small { font-size: 16px; }
  .math { font-size: 21px; font-style: italic; }
  .point { fill: #ffffff; stroke: #111111; stroke-width: 2; }
  .solid-point { fill: #111111; }
  .note-box { fill: #ffffff; stroke: #777777; stroke-width: 1; }
</style>
<rect width="820" height="430" fill="#ffffff"/>
<line x1="90" y1="340" x2="740" y2="340" class="axis" marker-end="url(#arrow)"/>
<line x1="250" y1="385" x2="250" y2="58" class="axis" marker-end="url(#arrow)"/>
<text x="748" y="362" class="math">x</text>
<text x="266" y="70" class="math">z</text>
<circle cx="250" cy="340" r="5" class="solid-point"/>
<circle cx="250" cy="160" r="5" class="solid-point"/>
<circle cx="500" cy="225" r="5" class="solid-point"/>
<text x="222" y="368" class="label">O</text>
<text x="268" y="153" class="label">e=(0,0,1)</text>
<text x="515" y="217" class="label">P=(r sin θ,0,r cos θ)</text>
<line x1="250" y1="340" x2="500" y2="225" class="curve"/>
<line x1="250" y1="160" x2="500" y2="225" class="curve-thin" stroke-dasharray="9 6"/>
<path d="M250 265 A75 75 0 0 1 318 309" class="curve-thin"/>
<text x="292" y="281" class="math">θ</text>
<text x="370" y="303" class="math">r</text>
<text x="380" y="177" class="math">ρ</text>
<line x1="500" y1="225" x2="500" y2="340" class="guide"/>
<line x1="250" y1="225" x2="500" y2="225" class="guide"/>
<rect x="470" y="72" width="278" height="54" rx="2" class="note-box"/>
<text x="486" y="105" class="math">ρ²=1−2r cos θ+r²</text>
</svg>
