<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">ポッホハマー二重ループ積分路</title>
<desc id="desc">基点Pから1と0を正負の向きに回る4つの経路を線種で区別した白黒の積分路図。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
</marker>

</defs>
<style>
  text { font-family: "Times New Roman", "Noto Serif JP", serif; fill: #111111; }
  .axis { stroke: #111111; stroke-width: 2; fill: none; }
  .tick { stroke: #111111; stroke-width: 1.4; }
  .guide { stroke: #777777; stroke-width: 1.3; stroke-dasharray: 7 6; fill: none; }
  .curve { stroke: #111111; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .curve-thin { stroke: #111111; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 19px; }
  .small { font-size: 16px; }
  .math { font-size: 21px; font-style: italic; }
  .point { fill: #ffffff; stroke: #111111; stroke-width: 2; }
  .solid-point { fill: #111111; }
  .note-box { fill: #ffffff; stroke: #777777; stroke-width: 1; }
</style>
<rect width="820" height="420" fill="#ffffff"/>
<line x1="95" y1="220" x2="725" y2="220" stroke="#777777" stroke-width="1.4"/>
<circle cx="245" cy="220" r="6" class="solid-point"/>
<circle cx="575" cy="220" r="6" class="solid-point"/>
<circle cx="410" cy="220" r="6" class="point"/>
<text x="238" y="248" class="label">0</text>
<text x="568" y="248" class="label">1</text>
<text x="400" y="248" class="math">P</text>

<path d="M410 200 L510 200 L510 220 A65 65 0 1 0 640 220 A65 65 0 1 0 510 220 L510 240 L410 240" class="curve"/>
<path d="M410 240 L310 240 L310 220 A65 65 0 1 0 180 220 A65 65 0 1 0 310 220 L310 200 L410 200" class="curve" stroke-dasharray="11 7"/>
<path d="M410 210 L532 210 L532 220 A43 43 0 1 1 618 220 A43 43 0 1 1 532 220 L532 230 L410 230" class="curve-thin" stroke-dasharray="11 5 2 5"/>
<path d="M410 230 L288 230 L288 220 A43 43 0 1 1 202 220 A43 43 0 1 1 288 220 L288 210 L410 210" class="curve-thin" stroke-dasharray="2 6"/>

<path d="M575 155 C540 155 520 176 512 205" class="curve-thin" marker-end="url(#arrow)"/>
<path d="M245 155 C210 155 190 176 182 205" class="curve-thin" stroke-dasharray="11 7" marker-end="url(#arrow)"/>
<path d="M575 177 C604 177 615 194 618 213" class="curve-thin" stroke-dasharray="11 5 2 5" marker-end="url(#arrow)"/>
<path d="M245 177 C274 177 285 194 288 213" class="curve-thin" stroke-dasharray="2 6" marker-end="url(#arrow)"/>

<line x1="120" y1="342" x2="175" y2="342" class="curve"/>
<text x="185" y="349" class="small">1+ (CCW)</text>
<line x1="420" y1="342" x2="475" y2="342" class="curve" stroke-dasharray="11 7"/>
<text x="485" y="349" class="small">0+ (CCW)</text>
<line x1="120" y1="382" x2="175" y2="382" class="curve-thin" stroke-dasharray="11 5 2 5"/>
<text x="185" y="389" class="small">1− (CW)</text>
<line x1="420" y1="382" x2="475" y2="382" class="curve-thin" stroke-dasharray="2 6"/>
<text x="485" y="389" class="small">0− (CW)</text>
</svg>
