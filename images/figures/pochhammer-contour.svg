  <path d="M520 97 C565 105 570 145 540 166" fill="none" stroke="#2563a6" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M420 204 L372 204" stroke="#2563a6" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M240 282 C195 274 190 234 220 213" fill="none" stroke="#2563a6" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="338" y="145" font-size="22" font-style="italic" fill="#173b6c">C</text>
  <text x="130" y="42" font-size="24" font-weight="600" fill="#173b6c">ポッホハマー積分路の模式図</text>
  <text x="132" y="75" font-size="18" fill="#64748b">分岐点 0, 1 を周回し、(0,1) を異なる分枝で往復する</text>
