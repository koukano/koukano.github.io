  <circle cx="530" cy="190" r="5" fill="#173b6c"/>
  <text x="222" y="220" font-size="22" fill="#334155">0</text>
  <text x="523" y="220" font-size="22" fill="#334155">1</text>
  <path d="M360 176 C430 176 470 176 505 176 C575 176 590 110 535 88 C475 65 445 135 492 166 C515 181 500 204 478 204 C430 204 390 204 355 204 C300 204 270 204 250 204 C180 204 165 270 220 292 C280 315 310 245 263 214 C240 199 255 176 277 176 C310 176 335 176 360 176"
