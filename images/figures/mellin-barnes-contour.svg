<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">Mellin-Barnes積分路</title>
  <desc id="desc">複素s平面で左側の極と右側の極を分離する縦の積分路L</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563a6"/></marker>
  </defs>
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="410" y="38" text-anchor="middle" font-size="24" font-weight="600" fill="#173b6c">Barnes積分の積分路 L</text>
  <line x1="80" y1="215" x2="745" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="365" x2="410" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <text x="748" y="237" font-size="18" fill="#64748b">Re s</text>
  <text x="423" y="77" font-size="18" fill="#64748b">Im s</text>
  <line x1="410" y1="345" x2="410" y2="92" stroke="#2563a6" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="425" y="118" font-size="23" font-style="italic" fill="#173b6c">L</text>
  <g fill="#173b6c">
    <circle cx="205" cy="145" r="6"/><circle cx="165" cy="145" r="6"/><circle cx="125" cy="145" r="6"/>
    <circle cx="225" cy="280" r="6"/><circle cx="185" cy="280" r="6"/><circle cx="145" cy="280" r="6"/>
    <circle cx="585" cy="145" r="6"/><circle cx="625" cy="145" r="6"/><circle cx="665" cy="145" r="6"/>
    <circle cx="565" cy="280" r="6"/><circle cx="605" cy="280" r="6"/><circle cx="645" cy="280" r="6"/>
  </g>
  <text x="94" y="117" font-size="18" fill="#334155">−a−n</text>
  <text x="112" y="315" font-size="18" fill="#334155">−b−n</text>
  <text x="560" y="117" font-size="18" fill="#334155">c+n</text>
  <text x="542" y="315" font-size="18" fill="#334155">d+n</text>
  <text x="120" y="382" font-size="18" fill="#64748b">Γ(a+s), Γ(b+s) の極</text>
  <text x="520" y="382" font-size="18" fill="#64748b">Γ(c−s), Γ(d−s) の極</text>
  <path d="M410 92 C690 80 770 180 742 215 C770 250 690 350 410 345" fill="none" stroke="#9dcef2" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="650" y="200" font-size="17" fill="#64748b">留数計算では右側へ閉じる場合もある</text>
</svg>