<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
<title id="title">Barnesの第一補題の積分路</title>
<desc id="desc">複素s平面でGamma(a+s),Gamma(b+s)の極を左、Gamma(c-s),Gamma(d-s)の極を右に分離する縦線Re s=sigma。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563a6"/></marker></defs>
<rect width="820" height="390" fill="#ffffff"/>
<text x="410" y="38" text-anchor="middle" font-size="24" font-weight="600" fill="#173b6c">Mellin–Barnes積分路 L : Re s=σ</text>
<line x1="75" y1="205" x2="750" y2="205" stroke="#94a3b8" stroke-width="2"/>
<line x1="410" y1="345" x2="410" y2="70" stroke="#2563a6" stroke-width="5" marker-end="url(#arrow)"/>
<text x="423" y="95" font-size="20" font-style="italic" fill="#173b6c">L</text>
<text x="425" y="225" font-size="17" fill="#334155">σ</text>
<text x="755" y="227" font-size="17" fill="#64748b">Re s</text>
<text x="423" y="77" font-size="17" fill="#64748b">Im s</text>
<g fill="#173b6c">
  <circle cx="160" cy="205" r="6"/><circle cx="205" cy="205" r="6"/><circle cx="250" cy="205" r="6"/>
</g>
<g fill="#4a9fdb">
  <rect x="178" y="199" width="12" height="12" transform="rotate(45 184 205)"/><rect x="223" y="199" width="12" height="12" transform="rotate(45 229 205)"/><rect x="268" y="199" width="12" height="12" transform="rotate(45 274 205)"/>
</g>
<g fill="#173b6c">
  <circle cx="565" cy="205" r="6"/><circle cx="610" cy="205" r="6"/><circle cx="655" cy="205" r="6"/>
</g>
<g fill="#4a9fdb">
  <rect x="538" y="199" width="12" height="12" transform="rotate(45 544 205)"/><rect x="583" y="199" width="12" height="12" transform="rotate(45 589 205)"/><rect x="628" y="199" width="12" height="12" transform="rotate(45 634 205)"/>
</g>
<text x="105" y="165" font-size="18" fill="#334155">s=−a−n</text>
<text x="205" y="255" font-size="18" fill="#1769aa">s=−b−n</text>
<text x="535" y="165" font-size="18" fill="#334155">s=c+n</text>
<text x="585" y="255" font-size="18" fill="#1769aa">s=d+n</text>
<text x="112" y="330" font-size="17" fill="#64748b">左側：Γ(a+s), Γ(b+s) の極</text>
<text x="500" y="330" font-size="17" fill="#64748b">右側：Γ(c−s), Γ(d−s) の極</text>
</svg>