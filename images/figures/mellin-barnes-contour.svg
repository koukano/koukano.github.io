<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
<title id="title">Mellin-Barnes積分路</title>
<desc id="desc">複素s平面で左側とright polesを分離する縦の積分路Lを黒線で示した図。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
</marker>

</defs>
<style>
  text { font-family: "Times New Roman", "Noto Serif JP", serif; fill: #111111; }
  .axis { stroke: #111111; stroke-width: 2; fill: none; }
  .tick { stroke: #111111; stroke-width: 1.4; }
  .guide { stroke: #777777; stroke-width: 1.3; stroke-dasharray: 7 6; fill: none; }
  .curve { stroke: #111111; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .curve-thin { stroke: #111111; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 19px; }
  .small { font-size: 16px; }
  .math { font-size: 21px; font-style: italic; }
  .point { fill: #ffffff; stroke: #111111; stroke-width: 2; }
  .solid-point { fill: #111111; }
  .note-box { fill: #ffffff; stroke: #777777; stroke-width: 1; }
</style>
<rect width="820" height="390" fill="#ffffff"/>
<line x1="72" y1="205" x2="758" y2="205" class="axis" marker-end="url(#arrow)"/>
<line x1="380" y1="344" x2="380" y2="62" class="axis" marker-end="url(#arrow)"/>
<line x1="440" y1="342" x2="440" y2="66" class="curve" marker-end="url(#arrow)"/>
<text x="752" y="229" class="math">Re s</text>
<text x="392" y="72" class="math">Im s</text>
<text x="450" y="92" class="math">L</text>
<text x="448" y="228" class="small">σ</text>
<circle cx="155" cy="205" r="6" class="solid-point"/>
<circle cx="205" cy="205" r="6" class="solid-point"/>
<circle cx="255" cy="205" r="6" class="solid-point"/>
<rect x="171" y="199" width="12" height="12" transform="rotate(45 177 205)" fill="#111111"/>
<rect x="221" y="199" width="12" height="12" transform="rotate(45 227 205)" fill="#111111"/>
<rect x="271" y="199" width="12" height="12" transform="rotate(45 277 205)" fill="#111111"/>
<circle cx="565" cy="205" r="6" class="solid-point"/>
<circle cx="615" cy="205" r="6" class="solid-point"/>
<circle cx="665" cy="205" r="6" class="solid-point"/>
<rect x="537" y="199" width="12" height="12" transform="rotate(45 543 205)" fill="#111111"/>
<rect x="587" y="199" width="12" height="12" transform="rotate(45 593 205)" fill="#111111"/>
<rect x="637" y="199" width="12" height="12" transform="rotate(45 643 205)" fill="#111111"/>
<text x="108" y="156" class="label">s=−a−n</text>
<text x="154" y="263" class="label">s=−b−n</text>
<text x="520" y="156" class="label">s=c+n</text>
<text x="566" y="263" class="label">s=d+n</text>
<text x="108" y="326" class="small">left poles</text>
<text x="558" y="326" class="small">右側の極列</text>
<rect x="462" y="72" width="150" height="42" rx="2" class="note-box"/>
<text x="476" y="100" class="math">Re s=σ</text>
</svg>
