<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">確率密度と区間確率</title>
  <desc id="desc">確率密度V_n(x)^2の下で区間aからbに対応する面積が確率を表す模式図</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#173b6c">確率密度 Vₙ(x)² と区間確率</text>
  <line x1="80" y1="290" x2="750" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="115" y1="315" x2="115" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <text x="758" y="314" font-size="18" fill="#64748b">x</text>
  <path d="M120 288 C170 286 185 250 205 215 C225 180 250 190 270 235 C290 278 325 275 350 210 C375 145 405 135 430 210 C455 285 495 278 520 220 C545 162 575 170 600 235 C625 300 665 288 730 288"
        fill="none" stroke="#2563a6" stroke-width="5"/>
  <path d="M300 267 C320 270 335 250 350 210 C375 145 405 135 430 210 C447 261 470 278 490 263 L490 290 L300 290 Z"
        fill="#dbe8f7" opacity="0.9"/>
  <line x1="300" y1="290" x2="300" y2="255" stroke="#173b6c" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="490" y1="290" x2="490" y2="255" stroke="#173b6c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="292" y="318" font-size="18" fill="#334155">a</text>
  <text x="484" y="318" font-size="18" fill="#334155">b</text>
  <text x="340" y="105" font-size="20" fill="#173b6c">P(a≤x≤b)=∫ₐᵇ Vₙ(x)² dx</text>
  <text x="220" y="342" font-size="18" fill="#64748b">青く塗った面積が、その区間に粒子を見いだす確率を表す</text>
</svg>