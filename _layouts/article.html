<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | 数学ノート</title>

  <link rel="stylesheet" href="/css/style.css">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    async>
  </script>

</head>

<body>

  <header>
    <h1>
      <a href="/">数学ノート</a>
    </h1>
  </header>


  <main class="article-container">

    <article>

      <h1>{{ page.title }}</h1>

      {{ content }}

    </article>

  </main>


  <footer>
    <p>© 2026 Math Notes</p>
  </footer>

</body>

</html>
